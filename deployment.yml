apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-app
  labels:
    app: vehicle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle
  template:
    metadata:
      labels:
        app: vehicle
    spec:
      containers:
        - name: vehicle
          image: dpranit/vehical:app
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-service
spec:
  type: NodePort
  selector:
    app: vehicle
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
